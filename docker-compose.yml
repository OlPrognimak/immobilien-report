services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FRONTEND_ORIGIN: http://localhost:3005
    ports:
      - "8085:8080"

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8085
    depends_on:
      - backend
    ports:
      - "3005:3000"
